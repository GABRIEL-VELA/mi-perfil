<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Perfil</h1>
    </header>

    <section id="informacion">
        <h2>Datos Personales</h2>
        <p><strong>Nombre:</strong> [Tu Nombre]</p>
        <p><strong>Semestre:</strong> [Tu Semestre]</p>
    </section>

    <section id="hobbies">
        <h2>Mis Hobbies</h2>
        <ul>
            <li>Leer</li>
            <li>Ver películas</li>
            <li>Jugar videojuegos</li>
            <li>Programar</li>
            <li>Hacer ejercicio</li>
        </ul>
    </section>

    <section id="series">
        <h2>Series Favoritas</h2>
        <div class="serie">
            <h3>Breaking Bad</h3>
            <img src="img/breaking-bad.jpg" alt="Breaking Bad">
        </div>
        <div class="serie">
            <h3>Stranger Things</h3>
            <img src="img/stranger-things.jpg" alt="Stranger Things">
        </div>
    </section>

    <footer>
        <p>&copy; 2025 - Mi Perfil</p>
    </footer>
</body>
</html>
